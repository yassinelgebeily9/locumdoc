# One-click deploy on Render (render.com): New > Blueprint > point at this repo.
# Records live in Firestore and PDFs in Firebase Storage (see docs/firebase-setup.md),
# so the web service itself keeps nothing and the free plan is enough.
services:
  - type: web
    name: locumdoc
    runtime: docker
    plan: free
    healthCheckPath: /robots.txt
    envVars:
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON   # the service account key file's contents
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_URL
        value: https://locumdoc.me
      - key: SECURE_COOKIES
        value: "1"
      - key: DATA_DIR
        value: /data
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: MAIL_FROM
        value: LocumDoc <hello@locumdoc.me>
      - key: CONTACT_EMAIL
        value: hello@locumdoc.me
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
