<div class="field{% if form.errors.get('consent') %} has-error{% endif %}">
  <label class="check"><input type="checkbox" name="consent" value="1" {% if form.clean.get('consent') %}checked{% endif %}>
    <span>I agree to the <a href="{{ url_for('public.terms') }}" target="_blank" rel="noopener">terms of use</a> and the <a href="{{ url_for('public.privacy') }}" target="_blank" rel="noopener">privacy notice</a>.</span></label>
  {% if form.errors.get('consent') %}<span class="error">{{ form.errors['consent'] }}</span>{% endif %}
</div>
